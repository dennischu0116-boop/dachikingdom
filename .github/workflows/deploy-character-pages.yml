name: Publish production character assets to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'assets/characters/**'
      - 'scripts/verify-production.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-character-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-character-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: npm ci

      - name: Verify production source and all 523 character images
        run: npm run verify:production

      - name: Stage public character assets
        run: |
          mkdir -p _site/assets/characters
          cp -R assets/characters/portraits assets/characters/thumbs assets/characters/headshots assets/characters/emperors assets/characters/manifest.json _site/assets/characters/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public character assets
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
