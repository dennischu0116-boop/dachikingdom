name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Push source to GAS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: npm ci

      - name: Verify production source and character assets
        run: npm run verify:production

      - name: Stage only the production Apps Script application
        shell: bash
        run: |
          mkdir -p gas_production_deploy
          cp ./程式碼.js ./CodeSave.js ./*.html ./appsscript.json gas_production_deploy/
          test "$(find gas_production_deploy -maxdepth 1 -type f | wc -l)" -eq 16
          test "$(find gas_production_deploy -maxdepth 1 -type f -name '*.js' | wc -l)" -eq 2
          test ! -e gas_production_deploy/BetaServer.js
          jq '.rootDir = "gas_production_deploy"' .clasp.json > .clasp.deploy.json
          mv .clasp.deploy.json .clasp.json

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push source to Google Apps Script
        run: npx --yes @google/clasp@3.4.1 push
