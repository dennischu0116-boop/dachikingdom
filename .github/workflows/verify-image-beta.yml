name: Validate and deploy v1.3.5-beta
on:
  push:
    branches: [performance-image-beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install beta verification tools
        run: npm ci
      - name: Parse combined GAS HTML JSX
        run: |
          node - <<'NODE'
          const fs=require('fs'),babel=require('@babel/core');
          const files=['ClientCore','ClientContent','ClientShell','ClientRules','ImageBeta','AppState','AppModals','AppGovernment','AppRoyal','AppWarAndMain'];
          const code=files.map(name=>fs.readFileSync(name+'.html','utf8')).join('\n');
          babel.transformSync(code,{babelrc:false,configFile:false,sourceType:'script',presets:[require('@babel/preset-react')]});
          console.log('Parsed',files.length,'fragments');
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check BetaServer.js
          node --check 程式碼.js
          node --check CodeSave.js
          grep -q 'data:image/svg+xml;base64,' ImageBeta.html
          ! grep -q "encodeURIComponent('<svg" ImageBeta.html
      - name: Check portrait assets and manifest integrity
        run: |
          python3 - <<'PY'
          import json, pathlib

          root=pathlib.Path('assets/characters')
          payload=json.loads((root/'manifest.json').read_text(encoding='utf8'))
          chars=payload['portraits']
          assert len(chars)==50
          assert len({x['thumb'] for x in chars.values()})==50
          assert len({x['full'] for x in chars.values()})==50
          required={record[size] for record in chars.values() for size in ('thumb','full')}
          actual={str(path.relative_to(root)) for path in root.rglob('*.webp')}
          assert actual==required, {'missing':sorted(required-actual),'extra':sorted(actual-required)}

          def dimensions(path):
              data=path.read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', path
              offset=12
              while offset+8<=len(data):
                  kind=data[offset:offset+4]
                  size=int.from_bytes(data[offset+4:offset+8],'little')
                  chunk=data[offset+8:offset+8+size]
                  if kind==b'VP8X':
                      return 1+int.from_bytes(chunk[4:7],'little'),1+int.from_bytes(chunk[7:10],'little')
                  if kind==b'VP8 ' and chunk[3:6]==b'\x9d\x01\x2a':
                      return int.from_bytes(chunk[6:8],'little')&0x3fff,int.from_bytes(chunk[8:10],'little')&0x3fff
                  if kind==b'VP8L' and chunk[:1]==b'/':
                      bits=int.from_bytes(chunk[1:5],'little')
                      return (bits&0x3fff)+1,((bits>>14)&0x3fff)+1
                  offset+=8+size+(size&1)
              raise AssertionError('No WebP dimensions: '+str(path))

          for relative in sorted(required):
              path=root/relative
              expected=(128,128) if relative.startswith('thumbs/') else (512,768)
              limit=30*1024 if relative.startswith('thumbs/') else 150*1024
              assert dimensions(path)==expected,(relative,dimensions(path),expected)
              assert path.stat().st_size<=limit,(relative,path.stat().st_size,limit)
          print('Verified 50 portrait IDs and 100 WebP assets')
          PY
      - name: Check beta server and deployment isolation
        run: |
          test ! -e .clasp.json
          test -f BetaServer.js
          ! grep -q 'const APP_VERSION = "v1.3.4"' ClientCore.html
          ! grep -E 'SpreadsheetApp|DriveApp|submitLeaderboardScore|getLeaderboard|1XgG3H6UsAsOkhYWEMnkf8svciGRGrXqcwQYzJtrEhABvrrfCfo0K9C0t' BetaServer.js
          mkdir gas_beta_verify
          cp BetaServer.js ./*.html appsscript.json gas_beta_verify/
          test ! -e gas_beta_verify/程式碼.js
          test ! -e gas_beta_verify/CodeSave.js
          test "$(find gas_beta_verify -maxdepth 1 -type f -name '*.js' -printf '%f\n')" = 'BetaServer.js'
          ! grep -E 'SpreadsheetApp|DriveApp|submitLeaderboardScore|getLeaderboard' gas_beta_verify/BetaServer.js
      - name: Build isolated browser preview
        run: |
          npm run build:beta-preview
          test -s .beta-preview/index.html
          test -s .beta-preview/tailwind.css
          ! grep -q '<?!=' .beta-preview/index.html

  deploy-beta-gas:
    name: Deploy verified commit to dedicated beta GAS
    needs: static-check
    if: github.ref == 'refs/heads/performance-image-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage only the isolated beta application
        env:
          BETA_GAS_SCRIPT_ID: ${{ secrets.BETA_GAS_SCRIPT_ID }}
          CLASPRC_BETA_JSON: ${{ secrets.CLASPRC_BETA_JSON }}
        run: |
          test -n "$BETA_GAS_SCRIPT_ID"
          test -n "$CLASPRC_BETA_JSON"
          test "$BETA_GAS_SCRIPT_ID" = "1sYB24vxAL27ObmiIaCAgfsEaedAxuBLlY-QmiUsfvgpWzW4HW62-0V1h"
          test "$BETA_GAS_SCRIPT_ID" != "1XgG3H6UsAsOkhYWEMnkf8svciGRGrXqcwQYzJtrEhABvrrfCfo0K9C0t"
          printf '%s' "$CLASPRC_BETA_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          mkdir -p gas_beta_deploy
          cp ./BetaServer.js ./*.html ./appsscript.json gas_beta_deploy/
          test ! -e gas_beta_deploy/程式碼.js
          test ! -e gas_beta_deploy/CodeSave.js
          test "$(find gas_beta_deploy -maxdepth 1 -type f -name '*.js' -printf '%f\n')" = 'BetaServer.js'
          ! grep -E 'SpreadsheetApp|DriveApp|submitLeaderboardScore|getLeaderboard' gas_beta_deploy/BetaServer.js
          printf '{"scriptId":"%s","rootDir":"gas_beta_deploy","scriptExtensions":[".gs",".js"],"htmlExtensions":[".html"],"jsonExtensions":[".json"]}\n' "$BETA_GAS_SCRIPT_ID" > .clasp.json
      - name: Push verified source to dedicated beta GAS
        run: npx --yes @google/clasp@3.4.1 push --force
