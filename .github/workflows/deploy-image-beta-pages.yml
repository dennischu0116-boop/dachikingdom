name: Publish beta character assets to GitHub Pages
on:
  push:
    branches: [performance-image-beta]
    paths:
      - 'assets/characters/**'
      - '.github/workflows/deploy-image-beta-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beta-character-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/performance-image-beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-image-beta
      - name: Check all 246 character files exist
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('assets/characters')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          required=[root/record[size] for record in manifest['portraits'].values() for size in ('thumb','full')]
          required += [root/'headshots'/f'{portrait_id}.webp' for portrait_id in manifest['portraits']]
          missing=[str(path) for path in required if not path.is_file()]
          if missing: raise SystemExit('Cannot publish: '+str(len(missing))+' missing images. First missing: '+', '.join(missing[:3]))
          print('Verified',len(required),'images')
          PY
      - name: Stage only public character assets at expected path
        run: |
          mkdir -p _site/assets/characters
          cp -R assets/characters/portraits assets/characters/thumbs assets/characters/headshots assets/characters/manifest.json _site/assets/characters/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/performance-image-beta'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public character assets
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
